apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: AETHER-SCORE-ingress
  namespace: AETHER-SCORE
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
spec:
  tls:
  - hosts:
    - api.AETHER-SCORE.io
    - AETHER-SCORE.io
    - www.AETHER-SCORE.io
    secretName: AETHER-SCORE-tls
  rules:
  - host: api.AETHER-SCORE.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 4000
  - host: AETHER-SCORE.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
  - host: www.AETHER-SCORE.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000


