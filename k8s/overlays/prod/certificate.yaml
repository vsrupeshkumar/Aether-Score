apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: AETHER-SCORE-tls
  namespace: AETHER-SCORE-prod
spec:
  secretName: AETHER-SCORE-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - api.AETHER-SCORE.io
  - AETHER-SCORE.io
  - www.AETHER-SCORE.io
  # Certificate will be automatically renewed by cert-manager
  # Default renewal is 30 days before expiration


